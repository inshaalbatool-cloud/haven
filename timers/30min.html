<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width", initial scale="1.0">
        <title> 30 Minute Timer </title>
        <link rel="stylesheet" href="t1.css">
    </head>
    <body>
        <div class="container">
            <h1 class="title">30 minute timer</h1>

            <hr>

            <p class="timer" id="30m-timer">30:00</p>

            <div class="button-wrapper">
                <button id="start"> Start! </button>
                <button id="stop"> Stop! </button>
                <button id="reset"> Reset! </button>
            </div>
        
        </div>
    </body>
